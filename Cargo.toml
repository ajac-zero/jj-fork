[package]
name = "jj-fork"
version = "0.2.7"
edition = "2024"
rust-version = "1.89"
description = "Maintain a fork as jj series and glues on top of upstream, and keep them current"
license = "MIT"
repository = "https://github.com/ajac-zero/jj-fork"
readme = "README.md"
keywords = ["jj", "jujutsu", "fork", "git", "vcs"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
globset = "0.4.20"
hmac = "0.13.0"
jj-cli = { version = "=0.43.0", default-features = false, features = ["git"] }
jj-lib = { version = "=0.43.0", default-features = false, features = ["git"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.6"

# jj-cli 0.43.0 calls Builder::enable_io, which tokio only provides on Windows with `net`.
tokio = { version = "1", default-features = false, features = ["net"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
